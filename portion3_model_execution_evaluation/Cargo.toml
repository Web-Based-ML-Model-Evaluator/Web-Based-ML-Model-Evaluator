[package]
name = "portion3_model_execution_evaluation"
version = "0.1.0"
edition = "2021"
authors = ["Shreya Patil <PES2UG24CS484>"]
description = "Portion 3: ML Algorithm Execution, Evaluation Metrics, and Comparison Dashboard"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
