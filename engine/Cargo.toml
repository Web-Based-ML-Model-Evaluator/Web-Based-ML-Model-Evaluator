[package]
name = "ml_engine"
version = "2.0.0"
edition = "2021"
authors = ["Team 13 <team13@pes.edu>"]
description = "On-device ML engine for the Web Based ML Model Evaluator. Compiles to WebAssembly and runs entirely in the visitor's browser."

[lib]
# cdylib: the WebAssembly module loaded by the browser. rlib: native builds for `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
smartcore = "0.6"
# Instant that also works in the browser (std::time::Instant panics on wasm32-unknown-unknown)
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
# Random ids come from the browser's crypto.getRandomValues
uuid = { version = "1.0", features = ["js"] }
