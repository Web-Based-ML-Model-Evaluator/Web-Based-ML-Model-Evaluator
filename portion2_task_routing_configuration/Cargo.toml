[package]
name = "portion2_task_routing_configuration"
version = "0.1.0"
edition = "2021"
authors = ["Satvik Phadke <PES2UG24CS450>"]
description = "Portion 2: ML Task Routing and Configuration Service for Web Based ML Model Evaluator"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
