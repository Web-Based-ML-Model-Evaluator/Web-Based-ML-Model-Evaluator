name: CI Pipeline

on:
  push:
    branches: [ main, 'issue-**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Rust Backend CI (Compiles and runs unified test suite)
  rust-backend:
    name: Unified Rust Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cargo check (Fast compile verification)
        run: cargo check --workspace --all-targets

      - name: Run unified backend tests
        run: cargo test --workspace --verbose

      - name: Code formatting check (rustfmt)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy code quality lint
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  # 2. Frontend CI (Typecheck & Vite Production Build)
  frontend-check:
    name: Frontend Client CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run Vite production build
        run: npm run build
