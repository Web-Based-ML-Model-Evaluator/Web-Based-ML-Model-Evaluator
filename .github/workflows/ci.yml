name: CI Pipeline

on:
  push:
    branches: [ main, 'issue-**', 'feat/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. The ML engine: native tests (the same Rust code that runs in the browser)
  engine:
    name: Engine (Rust) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check (native and WebAssembly)
        run: |
          cargo check --workspace --all-targets
          cargo check -p ml_engine --target wasm32-unknown-unknown

      - name: Run engine tests
        run: cargo test --workspace --verbose

      - name: Code formatting check (rustfmt)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  # 2. The static site: build the WebAssembly engine, typecheck and bundle the frontend
  web:
    name: Web bundle (WebAssembly + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI (must match the crate version)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the WebAssembly engine
        run: npm run build:engine

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build the static site
        run: npx vite build
