name: CI Pipeline

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'issue-**', 'cicd-**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Rust Backend CI (Compiles and runs unified test suite)
  rust-backend:
    name: Unified Rust Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cargo check (Fast compile verification)
        run: cargo check --workspace --all-targets

      - name: Run unified backend tests
        run: cargo test --workspace --verbose

      - name: Code formatting check (rustfmt)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy code quality lint
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  # 2. Frontend CI (Typecheck & Vite Production Build)
  frontend-check:
    name: Frontend Client CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run Vite production build
        run: npm run build

  # 3. Python Pytest Integration & End-to-End Suite
  pytest-integration:
    name: Pytest Integration & E2E Test Suite
    runs-on: ubuntu-latest
    needs: [rust-backend, frontend-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Unified Backend binary
        run: cargo build --workspace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Pytest test suite
        run: pytest tests_py -v --tb=short

  # 4. CI Completion Gate (Ensures all parallel jobs pass for branch protection)
  ci-gate:
    name: CI Pipeline Status Gate
    runs-on: ubuntu-latest
    needs: [rust-backend, frontend-check, pytest-integration]
    if: always()
    steps:
      - name: Check overall CI status
        run: |
          if [ "${{ needs.rust-backend.result }}" != "success" ] || \
             [ "${{ needs.frontend-check.result }}" != "success" ] || \
             [ "${{ needs.pytest-integration.result }}" != "success" ]; then
            echo "❌ One or more CI pipeline stages failed."
            exit 1
          fi
          echo "✅ All CI checks (Rust Backend, Frontend, Pytest Integration) passed successfully!"
