name: CD Release Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Package Production Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build frontend
        run: |
          npm ci
          npm run build

      - name: Build release binary for unified backend
        run: cargo build --release --workspace

      - name: Verify release binary
        run: ls -la target/release/web_ml_backend*

      - name: Upload Unified Backend release artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-ml-backend-linux
          path: target/release/web_ml_backend
          retention-days: 14

      - name: Upload Production Frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-ml-frontend-dist
          path: dist/
          retention-days: 14
