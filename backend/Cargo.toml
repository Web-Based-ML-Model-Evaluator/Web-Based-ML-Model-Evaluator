[package]
name = "web_ml_backend"
version = "2.0.0"
edition = "2021"
authors = ["Team 13 <team13@pes.edu>"]
description = "High-Performance Unified Backend & Machine Learning Engine for Web-Based ML Model Evaluator"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smartcore = "0.6"
ml_engine = { path = "../engine" }
